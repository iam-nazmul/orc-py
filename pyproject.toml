[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orc"
version = "0.1.0"
description = "TUI tool for running parallel Claude conversations with an orchestrator"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "aiosqlite>=0.20.0",
    "anyio>=4.0",
]

[project.scripts]
orc = "orc.__main__:main"
fake-claude = "orc.fake_claude:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orc"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.default.scripts]
run = "python -m orc"
doctor = "python -m orc doctor"
